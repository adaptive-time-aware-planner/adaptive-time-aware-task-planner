max_workers: 6
skip_completed: true
timeout_seconds: 1200
suite_name: "monitoring_budget"

approaches: ["bayesian"]
ablation_configs: [DEFAULT]
init_prior_configs:
  - CORRECT_ESTIMATE

beam_bound:
  - [10, 10]
etas:
  - 0.1

max_monitoring_per_critical_intervals:
  - 1
  - 2
  - 3
  - uncap

gt_distribution: "gaussian"
belief_update_method: "bayesian"
gt_seed: 42

scene_type: [kitchen]
scene_lists:
  kitchen:
    - "FloorPlan1"
    - "FloorPlan7"
    - "FloorPlan13"
    - "FloorPlan18"
    - "FloorPlan27"

cases:
  - "tasks_2_constraints_1"
  - "tasks_2_constraints_2"
  - "tasks_3_constraints_1"
  - "tasks_3_constraints_2"


task_folder_name:
  - "decomposed_final_revision_metadata_260402_v1"
  - "decomposed_final_revision_metadata_260402_v2"
  - "decomposed_final_revision_metadata_260402_v3"
  - "decomposed_final_revision_metadata_260402_v4"
  - "decomposed_final_revision_metadata_260402_v5"
max_tasks: 18

output_dir: "assets/results/offline_exp_result/offline_batch_monitoring_budget"
oracle_reference_dir: "assets/results/offline_oracle_reference"
