# Configuration for run_batch.py (offline only)
simulation: true # Enable Simulation mode
cloud_rendering: true

num_runs_per_instruction: 1 #반복 시행 횟수
max_retries: 1 # set to be 1
retry_delay_seconds: 2 # Delay in seconds between retries
max_workers: 6 # Maximum number of workers
instruction_delay_seconds: 0 # Delay in seconds between instructions

# Logging configuration
log_level: "WARNING" # Log level for the script. Options: 'DEBUG', 'INFO', 'WARNING', 'ERROR', 'CRITICAL'
start_idx: 1 # 시작하는 task의 번호

# Execution settings

# 실행하고자 하는 방법론리스트, 실행하지 않으려면 주석처리
approaches:
  - "bayesian"
  - "edf"
  - "cpm"
# Scripts that use LLMs and are subject to retries on failure
llm_scripts:
  # - "progprompt"
  # - "cap"
# # Scene lists for each scene type
scene_type: # Default scene type to run. Options: 'kitchen', 'bathroom'
  - kitchen
  # - bathroom
  # - real_world
scene_lists:
  kitchen:
    - "FloorPlan1"
    - "FloorPlan7"
    - "FloorPlan13"
    - "FloorPlan18"
    - "FloorPlan27"
  bathroom:
    # - "FloorPlan419"
    # - "FloorPlan422"
    # - "FloorPlan426"
    # - "FloorPlan427"
  real_world:
    # - "FloorPlan301"
ablation_configs:
  - DEFAULT
  - NONE_MONITORING
init_prior_configs: #초기 시간 값 종류
  - CORRECT_ESTIMATE
  # - OVER_ESTIMATE
  # - UNDER_ESTIMATE
  # - OVER_MEDIUM_ESTIMATE
  # - UNDER_MEDIUM_ESTIMATE
  # - OVER_ESTIMATE_130
  # - OVER_ESTIMATE_110
  # - UNDER_ESTIMATE_90
  # - UNDER_ESTIMATE_70

# ------------------------------------------------------------------------------
# Task Filtering
# ------------------------------------------------------------------------------
task_folder_name:
  - "decomposed_final_revision_metadata_260402_v1"
  - "decomposed_final_revision_metadata_260402_v2"
  - "decomposed_final_revision_metadata_260402_v3"
  - "decomposed_final_revision_metadata_260402_v4"
  - "decomposed_final_revision_metadata_260402_v5"
min_task_count: 0
min_constraint_count: 0
skip_completed: true

# ------------------------------------------------------------------------------
# Offline-only settings
# ------------------------------------------------------------------------------
cases:
  - "tasks_2_constraints_1"
  - "tasks_2_constraints_2"
  - "tasks_3_constraints_1"
  - "tasks_3_constraints_2"


max_tasks: 10

beam_bound:
  - [1, 1]
  - [5, 5]
  - [10, 10]
  - [20, 20]

etas:
  - 0.01
  - 0.1
  - 0.5
  - 0.9
nav_graph_source: "ai2thor_controller"
oracle_time_limit_seconds: 300

# ------------------------------------------------------------------------------
# Optional PF-vs-Bayesian experiment axes
# ------------------------------------------------------------------------------
gt_distribution: null        # null -> "constant"
belief_update_method: null   # null -> "bayesian"
particle_distribution: null  # null -> PF uses gt_distribution, others use "gaussian"
factor_alpha: null           # null -> constants.py default

# Result settings
output_dir: "assets/results/offline_exp_result/offline_batch"
oracle_reference_dir: "assets/results/offline_oracle_reference"
